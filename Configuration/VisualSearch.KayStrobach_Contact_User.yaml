Searches:
# ======================================================================================================================
  KayStrobach_Contact_User:
    search:
      repository: KayStrobach\Contact\Domain\Repository\UserRepository
    autocomplete:
      freetext:
        label: "Text"
        selector:
          conditions:
            once: true
          freeInput: true
        matches:
          like:
            - accounts.accountIdentifier
            - name.fullName
      accountIdentifier:
        label: "Account"
        selector:
          conditions:
            once: true
          freeInput: true
        matches:
          like:
            - accounts.accountIdentifier
      name:
        label: "Name"
        selector:
          conditions:
            once: true
          freeInput: true
        matches:
          like:
            - name.fullName
      institution:
        label: "Institution"
        selector:
          conditions:
            once: true
          labelProperty: name
          orderBy: name
          repository: KayStrobach\Contact\Domain\Repository\InstitutionRepository
        matches:
          equals:
            - institution
